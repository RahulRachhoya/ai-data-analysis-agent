services:
  # Backend FastAPI service
  - type: web
    name: data-analysis-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: E2B_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: PORT
        value: "8000"

  # Frontend Next.js service
  - type: web
    name: data-analysis-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    # IMPORTANT: Set NEXT_PUBLIC_API_URL to your ACTUAL deployed backend URL
    # (e.g. https://data-analysis-backend-abc123.onrender.com)
    # Do this in the Render dashboard under the frontend service Environment variables
    # after the backend service is deployed and has a public URL.
    # The value below is a placeholder and must be overridden.
    dockerBuildArgs:
      - NEXT_PUBLIC_API_URL=https://data-analysis-backend.onrender.com
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://data-analysis-backend.onrender.com
      - key: PORT
        value: "3000"

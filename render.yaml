services:
  # Backend FastAPI service
  - type: web
    name: data-analysis-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false  # MUST set manually in Render dashboard
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: E2B_API_KEY
        sync: false  # MUST set manually in Render dashboard
      - key: PORT
        value: "8000"

  # Frontend Next.js service
  - type: web
    name: data-analysis-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    # DO NOT hardcode the backend URL here anymore.
    # After deploying the backend service, copy its public URL
    # (e.g. https://data-analysis-backend-abc123.onrender.com)
    # and set it as an Environment Variable on THIS frontend service:
    #   NEXT_PUBLIC_API_URL = <paste the real backend URL>
    #
    # Then trigger a new deploy of the frontend.
    # The build arg below is a placeholder only.
    dockerBuildArgs:
      - NEXT_PUBLIC_API_URL=https://data-analysis-backend.onrender.com
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://data-analysis-backend.onrender.com
      - key: PORT
        value: "3000"
